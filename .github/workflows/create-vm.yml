name: Try to Create OCI VM

on:
  schedule:
    - cron: '6,16,26,36,46,56 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: oci-free-arm-single-instance
  cancel-in-progress: false

jobs:
  try-create:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
      IMAGE_ID: ${{ secrets.IMAGE_ID }}
      OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
      AD_NAME: ${{ secrets.AD_NAME }}
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Oracle SDK
        run: |
          python3 -m venv "$RUNNER_TEMP/oci-env"
          "$RUNNER_TEMP/oci-env/bin/pip" install --disable-pip-version-check oci==2.189.0
      - name: Check configuration and previous request
        id: check
        run: '"$RUNNER_TEMP/oci-env/bin/python" scripts/try_create.py check'
      - name: Request one instance
        id: request
        if: steps.check.outputs.status == 'ready'
        run: '"$RUNNER_TEMP/oci-env/bin/python" scripts/try_create.py launch'
      - name: 'Safe to retry: capacity unavailable'
        if: steps.request.outputs.status == 'capacity'
        run: echo 'Oracle has no free A1 host capacity. Retry permitted at next schedule.'
      - name: Stop automated attempts
        if: >-
          steps.request.outputs.status == 'accepted' ||
          steps.request.outputs.status == 'uncertain' ||
          steps.check.outputs.status == 'existing' ||
          steps.check.outputs.status == 'blocked'
        run: gh workflow disable create-vm.yml --repo "$GITHUB_REPOSITORY"
      - name: Capacity unavailable
        if: steps.request.outputs.status == 'capacity'
        run: exit 1
      - name: Manual review required
        if: >-
          steps.request.outputs.status == 'uncertain' ||
          steps.check.outputs.status == 'blocked'
        run: exit 1
